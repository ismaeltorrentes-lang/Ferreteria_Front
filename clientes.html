<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Ferretería Pescado Volador</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem("ferreteria:tema");if(t!=="oscuro"&&t!=="claro"){t=matchMedia("(prefers-color-scheme: dark)").matches?"oscuro":"claro"}document.documentElement.dataset.tema=t}catch(e){document.documentElement.dataset.tema="claro"}})()</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-vista="clientes">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="sitio">
    <div class="header-inner">
      <a class="marca" href="index.html">Pescado Volador</a>
      <nav class="nav" aria-label="Principal">
        <a href="index.html" data-permiso="view products">Productos</a>
        <a href="ventas.html" data-permiso="view sales">Ventas</a>
        <a href="recepcion.html" data-permiso="receive purchases">Recepción</a>
        <a href="compras.html" data-permiso="view purchases">Compras</a>
        <a href="proveedores.html" data-permiso="view suppliers">Proveedores</a>
        <a href="clientes.html" aria-current="page" data-permiso="view customers">Clientes</a>
        <a href="movimientos.html" data-permiso="view inventory-movements">Movimientos</a>
        <a href="catalogos.html" data-permiso="view categories">Catálogos</a>
      </nav>
      <div class="acciones">
        <button id="btn-tema" type="button" aria-pressed="false" aria-label="Modo oscuro">☾</button>
        <button id="btn-salir" type="button">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <div class="container">
    <main id="contenido" class="layout">
      <h1>Clientes</h1>
      <noscript><p class="error">Esta pantalla necesita JavaScript para consumir la API.</p></noscript>

      <section aria-labelledby="t-clientes" data-permiso="view customers">
        <h2 id="t-clientes">Listado de clientes</h2>
        <div id="crud-clientes"></div>
      </section>
    </main>
    <footer>
      <address class="contacto">
        <p>Correo electrónico: info@ferreteriapescadofeliz.com</p>
        <p>Teléfono: (506) 2665-1308</p>
      </address>
    </footer>
  </div>

  <script type="module" src="/src/paginas/clientes.js"></script>
</body>
</html>
