<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Ferretería Pescado Volador</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-vista="login">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="sitio">
    <div class="container header-inner">
      <span>Ferretería Pescado Volador</span>
    </div>
  </header>

  <div class="container">
    <main id="contenido" class="layout" style="--layout-cols: minmax(0, 28rem); justify-content: center;">
      <h1>Iniciar sesión</h1>
      <noscript><p class="error">Esta pantalla necesita JavaScript (Laboratorio 9).</p></noscript>

      <form id="login-form">
        <fieldset>
          <legend>Acceso a la API</legend>

          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" required autocomplete="username" aria-describedby="ayuda-email">
          <p class="ayuda" id="ayuda-email">admin@example.com · cajero@example.com · bodeguero@example.com</p>

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" aria-describedby="ayuda-password">
          <p class="ayuda" id="ayuda-password">Usuarios de prueba: contraseña “password”.</p>
        </fieldset>

        <p class="acciones">
          <button class="btn-primario" type="submit">Ingresar</button>
        </p>
        <p id="login-error" class="ayuda" role="alert" aria-live="assertive"></p>
      </form>
    </main>
    <footer>
      <address class="contacto">
        <p>Correo electrónico: info@ferreteriapescadofeliz.com</p>
        <p>Teléfono: (506) 2665-1308</p>
      </address>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
